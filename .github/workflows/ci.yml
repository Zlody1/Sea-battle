name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

      - name: Build Docker image
        run: |
          docker build -t sea-battle:test .

      # - name: Test container launch
      #   run: |
      #     docker run -d -p 3002:3002 --name test-container sea-battle:test
      #     sleep 5
      #     docker exec test-container node --version
      #     docker stop test-container
      #     docker rm test-container

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: aandre300
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag sea-battle:test aandre300/sea-battle:latest
          docker tag sea-battle:test aandre300/sea-battle:${{ github.sha }}
          docker push aandre300/sea-battle:latest
          docker push aandre300/sea-battle:${{ github.sha }}
